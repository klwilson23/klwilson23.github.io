- name: Arianne Nickels
  group: grad
  role: MSc student (Biology)
  focus: Pacific salmon habitat ecology in Heilstuk Territory
  photo: images/arianne-photo.jpeg
  bio: |
    Arianne (she/her) is a first-year Master student in the Department of Biological Sciences, co-supervised by Kyle Wilson and John Reynolds. Her research examines how fall drought events have affected chum and pink salmon populations over the past 20 years in Heiltsuk Territory on the central coast of British Columbia. She is also investigating whether certain stream characteristics have helped buffer salmon populations against drought. 
    
    Alongside her graduate research, Arianne leads a long-term salmon monitoring program in collaboration with Raincoast Conservation Foundation and the John Reynolds Lab. Each fall, she leads a field crew based in Bella Bella to count spawning salmon across 25 streams throughout Heiltsuk Territory.
