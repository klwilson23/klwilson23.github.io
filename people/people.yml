- name: Kate Mussett
  group: grad
  role: PhD student (REM)
  focus: Understanding Pacific salmon in Heiltsuk Territory
  photo: images/kate-photo.jpg
  bio: |
    As a settler-descended ecologist working in service of Indigenous communities’ sovereignty and stewardship, I aim to position my allyship through working in science as a service. Having been raised on the coast of Atlantic Canada, I have always felt called to a career protecting water, its inhabitants, and those who depend on them. From a very early age, I learned about the power that fish and water hold in bringing people together - a lesson which is often overlooked in classic Western scientific research. With these goals in mind, I have dedicated my academic and applied careers to gaining experience in fisheries and aquatic ecology in order to provide technical advice and capacity to First Nations across British Columbia. In focussing on salmon populations across BC’s coast, this has led my research interests and expertise through oceans and rivers, various disciplines, and spatial contexts.

    My Master's degree (University of British Columbia, Centre for Indigenous Fisheries) focused on weaving Indigenous Knowledges and Western science to co-create a biocultural indicator framework for Lower Fraser River region First Nations, with a focus on Pacific salmon habitat. My current PhD research (Simon Fraser University, Integrated Fisheries Ecology Lab) is in partnership with the Heiltsuk Integrated Resource Management Department (HIRMD), and aims to use quantitative methodologies to identify climate indicators of change in salmon populations throughout Heiltuk territories. I come to this work with gratitude and excitement to apply my knowledge to a new context in the Central Coast.

- name: Hutton Noth
  group: grad
  role: PhD student (REM)
  focus: Estimating conservation benchmarks for coho salmon
  photo: 
  bio: |
    I am a PhD student and settler researcher who approaches my work as science for service. I develop quantitative tools and field research that support Indigenous communities in the stewardship of salmon populations and in exercising their rights within federal fisheries management and policy. My time living in a small community on the west coast of Vancouver Island gave me a deep appreciation for the central role salmon play in the cultural, ecological, and economic well-being of coastal communities and ultimately led me to purse a career in fisheries. Working alongside Indigenous communities has since shaped the questions I pursue, grounding my research in priorities identified by the communities I work with.
    
    In partnership with Ha’oom Fisheries Society and the Fisheries Resources Reconciliation Agreement, my PhD research addresses a persistent challenge in salmon conservation: how can we understand the status of salmon populations when monitoring data is limited and environmental conditions are rapidly changing? To address these challenges, I am developing habitat-informed benchmarks for coho populations on the West Coast of Vancouver Island and Central Coast of British Columbia, while exploring how these benchmarks can account for changing environmental conditions and be applied across scales. This includes developing benchmarks at the scale individual watersheds and reflect definitions of risk relevant to First Nations stewardship, while also scaling these risks up to broader management units used in federal fisheries management. Ultimately, my research aims to improve our ability to identify populations at risk and respond to salmon declines despite increasing environmental and monitoring uncertainty.

