- name: Kyle Wilson (he/him)
  group: pi
  role: Assistant Professor, principal investigator
  photo: images/kyle-photo.jpg
  bio: |
    I am an assistant professor in integrated fisheries ecology in the School of Resource and Environmental Management at Simon Fraser University. Currently, I serve as a member of the COSEWIC Marine Fishes Species Specialist Subcommittee, Central Coast MaPP advisory committee, and on technical working groups (salmon/crab/risk benchmarks) under the Fishery Resources Reconciliation Agreement. Prior to SFU, I was the Applied Quantitative Biologist at the Central Coast Indigenous Resource Alliance.
