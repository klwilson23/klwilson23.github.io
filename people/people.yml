- name: Lindsay Begemann
  group: grad
  role: MRM student (REM)
  focus: Consequences of salmon fishery closures in the Central Coast
  photo: images/lindsay-photo.png
  bio: |
    Lindsay (she/her) is a Master's student in the Integrated Fisheries Ecology lab at SFU. In partnership with the Wild Salmon Centre and the Central Coast Indigenous Resource Alliance, her research evaluates the effectiveness of commercial salmon fishery closures on the Central Coast of British Columbia in restoring target and bycatch salmon populations. She integrates quantitative methods, including population modelling and bioeconomic simulations of future harvest and abundance scenarios, with qualitative methods to inform collaborative management of Pacific salmon. 
    
    Lindsay graduated from the University of Waterloo with a Bachelor of Environment in 2021 and worked in salmon fisheries management with Fisheries and Oceans Canada before her graduate studies at SFU.

