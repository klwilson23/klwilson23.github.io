- name: Hannah Watkins
  group: postdoc
  role: Liber Ero Postdoctoral Fellow
  focus: Understanding Pacific herring ecosystems in Kitasoo Xai'xais territory
  photo: images/hannah-photo.png
  links:
    - label: Website
      url: https://hannahvwatkins.weebly.com/
  bio: |
    Hannah (she/her) is a postdoctoral fellow in the Integrated Fisheries Ecology Lab and the Ocean Relations Collaborative at SFU. She is broadly interested in how quantitative tools can be re-envisioned and applied in ways that support ecologically sustainable and socially just conservation actions. She's stoked on finding ways to bring diverse knowledge systems and data sources together to solve problems. Her current project (Git Qṃsistá, or "People of the moon tipped over") is a collaboration with the Kitasoo Xai'xais Stewardship Authority, DFO, and Oceana Canada, focused on how First Nations and Canada can work together to steward marine resources. Specifically, she is working on understanding the relationships between Pacific herring and their predators, revitalizing Kitasoo Xai'xais restoration practices for herring, and learning from the diverse perspectives on the herring ecosystem in Kitasoo Xai'xais territory to shape how we steward this system into the future.
    
    Hannah is a recovering terrestrial ecologist, having worked on lizards, sage-grouse, and leopards in her early days in ecology. She completed her PhD at SFU in 2024, where she focused on all things echinoderm. Her work spanned from modelling the decline of Sunflower Sea Stars in Canada for a COSEWIC assessment, to uncovering patterns of serial depletion in the commercial sea cucumber fishery in British Columbia, to collecting bags of sea cucumber pee.
  
- name: Ellyn Davidson
  group: postdoc
  role: Postdoctoral Fellow
  focus: Dungeness crab movement ecology in Kitasoo Xai'xais territory
  photo: images/ellyn-photo.jpeg
  bio: |
    Ellyn (she/her) is an Ecologist and Postdoctoral Researcher in the Integrated Fisheries Ecology Lab at SFU. She is interested in understanding and modeling the spatial patterns of animals, including movements, and using that information to support conservation and to improve management outcomes. Ellyn completed her PhD at the University of Windsor in 2025 where she used various methodologies (acoustic and satellite telemetry, stable isotope analysis) to investigate the movement ecology of Arctic marine species, including Greenland halibut and porcupine crab, in offshore of Baffin Bay, Nunavut. 
    
    During her Master's degree (University Centre of the Westfjords, Iceland) and in work outside of academia (e.g. with CPAWS and WWF-Canada), Ellyn was involved in projects that used spatial data for marine and terrestrial species, including whales, caribou, and fishes, to model habitat use under changing environmental conditions. Her current project is to work collaboratively with Kitasoo Xai’xais First Nation and DFO to track movements of Dungeness crab in Kitasoo Xai’xais territory. 
  
