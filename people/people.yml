- name: Emma Graham
  group: grad
  role: MRM student (REM)
  focus: Managing Fraser River sockeye fisheries against en-route mortality
  photo: images/emma-graham-photo.jpg
  bio: |
    Emma (she/her) is a master’s student in the Integrated Fisheries Ecology Lab and a member of the Aquatic Research Cooperative (ARC) Institute at Simon Fraser University. She graduated with distinction from the University of the Fraser Valley with a Bachelor of Integrated Studies and Geographic Information Systems Certificate. Following completion of her undergraduate degree, Emma worked with the Pacific Salmon Commission (PSC) hydroacoustic team as an assistant fisheries technician.

    The objective of her master’s thesis is to improve the estimates of en route mortality of sockeye salmon (Oncorhynchus nerka) in the Fraser River watershed. Well informed en route mortality estimates are critical to implement management adjustments that accurately capture the discrepancy between potential and actual spawning escapement, in large part due to natural mortality caused by adverse environmental conditions. Improving predictions of these environmental factors (namely temperature and discharge) and quantifying their uncertainty are important aspects of this project, especially in our changing climate. 

- name: Marie Vivet
  group: grad
  role: MRM student (REM)
  focus: Groundfish ecology and fisheries management
  photo: images/marie-photo.jpg
  bio: |
    Marie (she/her) is a first-year Master’s student in the Resource and Environmental Management program at SFU. As a member of the Integrated Fisheries Ecology Lab, she is particularly interested in using quantitative modelling approaches to support decision-making in fisheries management. For her thesis, Marie is investigating whether current monitoring strategies can reliably detect and estimate expected rockfish recoveries within the marine protected area network (MPAN) being developed for the Northern Shelf Bioregion. Her research aims to provide policy-relevant insights for survey planners by informing effective and realistic MPAN monitoring.
    
    Marie completed her Bachelor’s degree in Agricultural and Environmental Sciences at McGill University. During her undergraduate studies, she gained hands-on experience working with birds, insects, mammals, and fish and developed strong data analysis skills in R. Her interest in marine biology was fostered during a two-week field course in St. Andrews, New Brunswick, where she conducted marine mammal surveys and participated in zooplankton tows. In her spare time, Marie enjoys hiking the beautiful trails around Vancouver, exploring tidepools for marine life, and photographing the wildlife she encounters along the way.
  
